services:
  backend:
    build:
      context: ./backend
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: sqlite:///./recruitsmart.db
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  # Add a Postgres service when moving beyond the MVP SQLite setup.
